; pytest configuration.
;
; Standalone pytest.ini rather than a pyproject block, matching xo-space:
; `unittest discover -s tests` is the primary gate and every test is a
; plain unittest.TestCase that must run identically under both runners:
;
;   venv/bin/python -m unittest discover -s tests    # the gate
;   venv/bin/python -m pytest -q
[pytest]
testpaths = tests
python_files = test_*.py
