name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  applications:
    # The documented build: qq sync fetches the apps at the commits infra/repo.toml pins, then npm
    # copies them into app/, applies Euler's adapters and builds. qq runs on Linux and macOS only.
    name: App builds / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QQ_COMMIT: b205b0ecb5b528db5e582b7371ca39dba53f638a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install qq
        run: |
          git init --quiet "$RUNNER_TEMP/qq"
          git -C "$RUNNER_TEMP/qq" fetch --quiet --depth=1 https://github.com/quirq-ai/qq "$QQ_COMMIT"
          git -C "$RUNNER_TEMP/qq" checkout --quiet --detach FETCH_HEAD
          echo "$RUNNER_TEMP/qq/bin" >> "$GITHUB_PATH"
      - run: qq sync
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npx nx show projects
