name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  applications:
    # The documented build: qq sync fetches the apps at the commits infra/repo.toml pins, then npm
    # copies them into app/, applies Euler's adapters and builds. qq runs on Linux and macOS only.
    name: App builds / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QQ_COMMIT: b205b0ecb5b528db5e582b7371ca39dba53f638a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install qq
        run: |
          git init --quiet "$RUNNER_TEMP/qq"
          git -C "$RUNNER_TEMP/qq" fetch --quiet --depth=1 https://github.com/quirq-ai/qq "$QQ_COMMIT"
          git -C "$RUNNER_TEMP/qq" checkout --quiet --detach FETCH_HEAD
          echo "$RUNNER_TEMP/qq/bin" >> "$GITHUB_PATH"
      - run: qq sync
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npx nx show projects

  pins:
    # The manifest is valid, nothing else parses it, and every app pin is a commit on that app's main.
    name: Pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYNC_COMMIT: 9821f745690d5150cac70cd2eee54c97d431e6c3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install qqsync
        run: python -m pip install --quiet "qqsync @ git+https://github.com/quirq-ai/sync@$SYNC_COMMIT"
      - run: qqsync validate infra/repo.toml
      - run: qqsync guard .
      - name: Each pin is on its app's main
        run: |
          qqsync pins --strict infra/repo.toml | while IFS="$(printf '\t')" read -r pin digest source; do
            commit=${digest#git:}
            dir="$RUNNER_TEMP/${pin#deps.}"
            git init --quiet "$dir"
            git -C "$dir" fetch --quiet --filter=tree:0 "$source" main
            git -C "$dir" merge-base --is-ancestor "$commit" FETCH_HEAD || { echo "$pin: $commit is not on $source main"; exit 1; }
            echo "$pin: $commit is on $source main"
          done
